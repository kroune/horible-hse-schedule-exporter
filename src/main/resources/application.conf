# HSE Calendar Exporter Configuration (HOCON format)

ktor {
  application {
    modules = ["io.github.kroune.ApplicationKt.module"]
  }
  deployment {
    port = 8080
  }
}

hse {
  email = "redacted"
}

calendar {
  # Тип экспортера: google, yandex, both
  type = "google"

  google {
    credentials_file = "credentials.json"
    tokens_directory = "tokens"
  }

  yandex {
    email = "redacted"
    app_password = "redacted
  }
}

polling {
  # Интервал полинга в часах (по умолчанию 24 часа)
  interval_hours = 24
  # Количество месяцев вперед для получения расписания
  months_ahead = 1
}

retry {
  # Максимальное количество попыток при ошибках API
  max_attempts = 3
  # Начальная задержка перед повтором (в секундах)
  initial_delay_seconds = 1
}

